# TraceCheck settings. Illustrative values; agree them with a CBAM consultant.

# Material reconciliation: allowed gap between steel consumed and
# (product + scrap), as a share of steel consumed. 0.02 = 2 percent.
mass_balance_tolerance: 0.02

# Extraction: fields below this confidence are marked needs_review.
review_confidence_threshold: 0.85

reporting_year: 2026

# Chemistry check: illustrative synthetic ranges, % by mass. Not real grade limits.
grade_ranges:
  "SAE 1022 (synthetic)":
    Mn: [0.70, 1.00]
    Cr: [0.00, 0.20]
    Ni: [0.00, 0.20]
